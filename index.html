<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const CLIENT_ID = "VGpJ9UId4pH0TheoJUoTuVczLidyM3IQ";

    const REDIRECT_URI =
      "https://maricenktr.github.io/nktr-trello-onboarding/oauth-callback.html";


    /*
     * =========================================================
     * SOURCE CARD DETECTION
     * =========================================================
     *
     * Required naming structure:
     *
     * 🔒︎ ONB | COMPANY | Stappenbron
     *
     * Example:
     * 🔒︎ ONB | BMS | Stappenbron
     */

    function getCompanyFromSourceCardName(name) {
      const match = (name || "").match(
        /^🔒︎\s*ONB\s*\|\s*(.+?)\s*\|\s*Stappenbron$/i
      );

      if (!match) {
        return null;
      }

      return match[1].trim();
    }


    function isSourceCard(card) {
      return !!getCompanyFromSourceCardName(
        card.name
      );
    }


    async function getSourceCards(t) {
      const cards = await t.cards(
        "id",
        "name",
        "checklists"
      );

      return cards
        .map(function(card) {
          const company =
            getCompanyFromSourceCardName(
              card.name
            );

          if (!company) {
            return null;
          }

          return {
            id: card.id,
            name: card.name,
            company: company,
            checklists:
              card.checklists || []
          };
        })
        .filter(Boolean)
        .sort(function(a, b) {
          return a.company.localeCompare(
            b.company
          );
        });
    }


    /*
     * =========================================================
     * DUPLICATE EMPLOYEE DETECTION
     * =========================================================
     */

    function normalizeName(name) {
      return (name || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }


    async function isDuplicateCard(t) {
      const currentCard =
        await t.card(
          "id",
          "name"
        );

      if (isSourceCard(currentCard)) {
        return false;
      }

      const cards =
        await t.cards(
          "id",
          "name"
        );

      const currentName =
        normalizeName(
          currentCard.name
        );

      if (!currentName) {
        return false;
      }

      const matches =
        cards.filter(function(card) {

          if (isSourceCard(card)) {
            return false;
          }

          return (
            normalizeName(card.name) ===
            currentName
          );
        });

      return matches.length > 1;
    }


    /*
     * =========================================================
     * OAUTH
     * =========================================================
     */

    async function getOAuthToken(t) {
      try {
        const oauth =
          t.getOAuth2ApiClient();

        return await oauth.getAccessToken();

      } catch (error) {
        return null;
      }
    }


    async function authorizeUser(t) {
      try {
        const oauth =
          t.getOAuth2ApiClient();

        await oauth.authorize({
          scopes: [
            "read:board:trello",
            "write:board:trello"
          ]
        });

        await t.alert({
          message:
            "NKTR Onboarding authorized"
        });

      } catch (error) {
        console.error(
          "Authorization failed:",
          error
        );

        await t.alert({
          message:
            "Authorization failed"
        });
      }
    }


    /*
     * =========================================================
     * COPY CHECKLISTS FROM SOURCE CARD
     * =========================================================
     */

    async function copyCompanyChecklists(
      t,
      company
    ) {
      const token =
        await getOAuthToken(t);

      if (!token) {
        throw new Error(
          "Please authorize NKTR Onboarding first"
        );
      }


      const currentCard =
        await t.card(
          "id",
          "name"
        );


      const sourceCards =
        await getSourceCards(t);


      const sourceCard =
        sourceCards.find(
          function(card) {
            return (
              card.company === company
            );
          }
        );


      if (!sourceCard) {
        throw new Error(
          "Template not found for " +
          company
        );
      }


      if (
        !sourceCard.checklists ||
        sourceCard.checklists.length === 0
      ) {
        throw new Error(
          company +
          " template has no checklists"
        );
      }


      const existing =
        await t.card(
          "checklists"
        );


      if (
        existing.checklists &&
        existing.checklists.length > 0
      ) {
        throw new Error(
          "This employee already has checklists"
        );
      }


      /*
       * Copy every checklist found on the
       * source card.
       *
       * Therefore FASE 4, FASE 5, etc.
       * automatically work in the future.
       */

      for (
        const checklist
        of sourceCard.checklists
      ) {

        const url =
          "https://api.trello.com/1/cards/" +
          currentCard.id +
          "/checklists?idChecklistSource=" +
          encodeURIComponent(
            checklist.id
          );


        const response =
          await fetch(
            url,
            {
              method: "POST",

              headers: {
                "Authorization":
                  "Bearer " + token,

                "Accept":
                  "application/json"
              }
            }
          );


        if (!response.ok) {
          throw new Error(
            "Checklist copy failed: " +
            response.status
          );
        }
      }
    }


    /*
     * =========================================================
     * COMPANY SELECTION
     * =========================================================
     */

    async function chooseCompany(
      t,
      company
    ) {
      try {

        /*
         * Company can only be set once.
         */

        const existingCompany =
          await t.get(
            "card",
            "shared",
            "company",
            null
          );


        if (existingCompany) {
          throw new Error(
            "Company already set to " +
            existingCompany
          );
        }


        await copyCompanyChecklists(
          t,
          company
        );


        await t.set(
          "card",
          "shared",
          "company",
          company
        );


        await t.closePopup();


        await t.alert({
          message:
            company +
            " onboarding loaded"
        });


      } catch (error) {

        console.error(error);


        await t.alert({
          message:
            error.message
        });
      }
    }


    /*
     * =========================================================
     * DYNAMIC COMPANY MENU
     * =========================================================
     */

    async function openCompanySelector(t) {

      const sourceCards =
        await getSourceCards(t);


      if (
        sourceCards.length === 0
      ) {

        return t.alert({
          message:
            "No onboarding templates found"
        });
      }


      const items =
        sourceCards.map(
          function(source) {

            return {
              text: source.company,

              callback:
                function(t) {

                  return chooseCompany(
                    t,
                    source.company
                  );
                }
            };
          }
        );


      return t.popup({
        title: "Select company",
        items: items
      });
    }


    /*
     * =========================================================
     * POWER-UP
     * =========================================================
     */

    window.TrelloPowerUp.initialize({

      /*
       * -------------------------------------------------------
       * OPEN CARD BADGES
       * -------------------------------------------------------
       */

      "card-detail-badges":
        async function(t) {

          const card =
            await t.card(
              "name"
            );


          /*
           * Source cards don't get employee UI.
           */

          if (isSourceCard(card)) {
            return [];
          }


          const badges = [];


          /*
           * Duplicate warning.
           */

          const duplicate =
            await isDuplicateCard(t);


          if (duplicate) {

            badges.push({
              title: "Warning",
              text:
                "Duplicate employee name",
              color: "red"
            });
          }


          /*
           * Authorization badge.
           *
           * Visible only to users who have
           * not authorized NKTR Onboarding.
           */

          const token =
            await getOAuthToken(t);


          if (!token) {

            badges.push({
              title: "NKTR Access",
              text: "Authorize",

              callback:
                function(t) {

                  return authorizeUser(t);
                }
            });
          }


          /*
           * Company badge.
           */

          const company =
            await t.get(
              "card",
              "shared",
              "company",
              null
            );


          if (company) {

            badges.push({
              title: "Company",
              text: company
            });

          } else {

            badges.push({
              title: "Company",
              text: "Set company",

              callback:
                function(t) {

                  return openCompanySelector(
                    t
                  );
                }
            });
          }


          return badges;
        },


      /*
       * -------------------------------------------------------
       * CLOSED CARD BADGES
       * -------------------------------------------------------
       */

      "card-badges":
        async function(t) {

          const card =
            await t.card(
              "name"
            );


          if (isSourceCard(card)) {
            return [];
          }


          const badges = [];


          /*
           * Dynamic duplicate warning.
           */

          badges.push({
            dynamic:
              async function() {

                const duplicate =
                  await isDuplicateCard(
                    t
                  );


                return {
                  text:
                    duplicate
                      ? "⚠ DUPLICATE"
                      : "",

                  color:
                    duplicate
                      ? "red"
                      : null,

                  refresh: 10
                };
              }
          });


          /*
           * Company on closed card.
           */

          const company =
            await t.get(
              "card",
              "shared",
              "company",
              null
            );


          if (company) {

            badges.push({
              text: company
            });
          }


          return badges;
        }


    }, {

      clientId: CLIENT_ID,
      redirectUri: REDIRECT_URI

    });

  </script>
</body>
</html>
