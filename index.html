<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const ICON =
      "https://cdn.hyperdev.com/us-east-1%3A3d31b21c-01a0-4da2-8827-4bc6e88b7618%2Ficon-gray.svg";

    window.TrelloPowerUp.initialize({

      "card-buttons": function (t) {
        return [{
          icon: ICON,
          text: "Set company",
          condition: "always",
          callback: function (t) {
            return t.alert({
              message: "NKTR Power-Up is working"
            });
          }
        }];
      }

    });
  </script>
</body>
</html>
