<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>

const CLIENT_ID =
  "VGpJ9UId4pH0TheoJUoTuVczLidyM3IQ";

const REDIRECT_URI =
  "https://maricenktr.github.io/nktr-trello-onboarding/oauth-callback.html";

const TOTAL_PROGRESS_BLOCKS = 10;

const FULLY_OPERATIONAL_LIST =
  "Fully Operational";


/* =========================================================
   TEMPLATE DETECTION
   ========================================================= */

function getCompanyFromSourceCardName(name) {

  const match = (name || "").match(
    /^🔒︎\s*ONB\s*\|\s*(.+?)\s*\|\s*Stappenbron$/i
  );

  if (!match) {
    return null;
  }

  return match[1].trim();
}


function normalizeCompany(company) {

  return (company || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


function isSourceCard(card) {

  return !!getCompanyFromSourceCardName(
    card.name
  );
}


async function getSourceCards(t) {

  const cards = await t.cards(
    "id",
    "name",
    "checklists"
  );

  return cards

    .map(function(card) {

      const company =
        getCompanyFromSourceCardName(
          card.name
        );

      if (!company) {
        return null;
      }

      return {

        id:
          card.id,

        name:
          card.name,

        company:
          company,

        companyKey:
          normalizeCompany(company),

        checklists:
          card.checklists || []
      };
    })

    .filter(Boolean)

    .sort(function(a, b) {

      return a.company.localeCompare(
        b.company
      );
    });
}


/* =========================================================
   TEMPLATE HEALTH
   ========================================================= */

async function isTemplateEmpty(t) {

  const result =
    await t.card(
      "checklists"
    );

  const checklists =
    result.checklists || [];

  return checklists.length === 0;
}


/* =========================================================
   DUPLICATE COMPANY / TEMPLATE DETECTION
   ========================================================= */

async function isDuplicateCompanyTemplate(t) {

  const currentCard =
    await t.card(
      "name"
    );

  const company =
    getCompanyFromSourceCardName(
      currentCard.name
    );

  if (!company) {
    return false;
  }

  const companyKey =
    normalizeCompany(company);

  const sourceCards =
    await getSourceCards(t);

  const matches =
    sourceCards.filter(
      function(source) {

        return (
          source.companyKey ===
          companyKey
        );
      }
    );

  return matches.length > 1;
}


/* =========================================================
   DUPLICATE EMPLOYEE DETECTION
   ========================================================= */

function normalizeName(name) {

  return (name || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


async function isDuplicateCard(t) {

  const currentCard =
    await t.card(
      "id",
      "name"
    );

  if (isSourceCard(currentCard)) {
    return false;
  }

  const cards =
    await t.cards(
      "id",
      "name"
    );

  const currentName =
    normalizeName(
      currentCard.name
    );

  if (!currentName) {
    return false;
  }

  const matches =
    cards.filter(function(card) {

      if (isSourceCard(card)) {
        return false;
      }

      return (
        normalizeName(card.name) ===
        currentName
      );
    });

  return matches.length > 1;
}


/* =========================================================
   CHECKLIST PROGRESS
   ========================================================= */

async function getChecklistProgress(t) {

  const card =
    await t.card(
      "badges"
    );

  const cardBadges =
    card.badges || {};

  return {

    total:
      cardBadges.checkItems || 0,

    completed:
      cardBadges.checkItemsChecked || 0
  };
}


async function getProgressBar(t) {

  const progress =
    await getChecklistProgress(t);

  if (progress.total === 0) {
    return "";
  }

  const filled =
    Math.round(
      (
        progress.completed /
        progress.total
      ) *
      TOTAL_PROGRESS_BLOCKS
    );

  return (
    "█".repeat(filled) +
    "░".repeat(
      TOTAL_PROGRESS_BLOCKS -
      filled
    )
  );
}


async function hasIncompleteSteps(t) {

  const progress =
    await getChecklistProgress(t);

  if (progress.total === 0) {
    return false;
  }

  return (
    progress.completed <
    progress.total
  );
}


/* =========================================================
   OAUTH
   ========================================================= */

async function getOAuthToken(t) {

  try {

    const oauth =
      t.getOAuth2ApiClient();

    return await oauth.getAccessToken();

  } catch (error) {

    return null;
  }
}


async function authorizeUser(t) {

  try {

    const oauth =
      t.getOAuth2ApiClient();

    await oauth.authorize({

      scopes: [
        "read:board:trello",
        "write:board:trello"
      ]
    });

    await t.alert({

      message:
        "NKTR Onboarding is geautoriseerd"
    });

  } catch (error) {

    console.error(
      "Autorisatie mislukt:",
      error
    );

    await t.alert({

      message:
        "Autorisatie mislukt"
    });
  }
}


/* =========================================================
   CARD COVER
   ========================================================= */

async function setGreenHalfCover(
  token,
  cardId
) {

  const response =
    await fetch(

      "https://api.trello.com/1/cards/" +
      cardId,

      {

        method:
          "PUT",

        headers: {

          "Authorization":
            "Bearer " + token,

          "Accept":
            "application/json",

          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            cover: {

              color:
                "green",

              size:
                "normal",

              brightness:
                "dark"
            }
          })
      }
    );

  if (!response.ok) {

    throw new Error(
      "Groene omslag mislukt: " +
      response.status
    );
  }
}


async function removeCardCover(
  token,
  cardId
) {

  const response =
    await fetch(

      "https://api.trello.com/1/cards/" +
      cardId,

      {

        method:
          "PUT",

        headers: {

          "Authorization":
            "Bearer " + token,

          "Accept":
            "application/json",

          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            cover:
              ""
          })
      }
    );

  if (!response.ok) {

    throw new Error(
      "Omslag verwijderen mislukt: " +
      response.status
    );
  }
}


async function syncOperationalCover(t) {

  try {

    const card =
      await t.card(
        "id",
        "name",
        "cover"
      );

    if (isSourceCard(card)) {
      return;
    }

    const list =
      await t.list(
        "name"
      );

    const token =
      await getOAuthToken(t);

    if (!token) {
      return;
    }

    const isFullyOperational =
      list.name ===
      FULLY_OPERATIONAL_LIST;

    const isGreen =
      card.cover &&
      card.cover.color === "green";

    const isHalfCover =
      card.cover &&
      card.cover.size === "normal";


    if (isFullyOperational) {

      if (
        !isGreen ||
        !isHalfCover
      ) {

        await setGreenHalfCover(
          token,
          card.id
        );
      }

      return;
    }


    if (
      !isFullyOperational &&
      isGreen
    ) {

      await removeCardCover(
        token,
        card.id
      );
    }

  } catch (error) {

    console.error(
      "Omslagsynchronisatie mislukt:",
      error
    );
  }
}


/* =========================================================
   COPY COMPANY CHECKLISTS
   ========================================================= */

async function copyCompanyChecklists(
  t,
  company
) {

  const token =
    await getOAuthToken(t);

  if (!token) {

    throw new Error(
      "Autoriseer NKTR Onboarding eerst"
    );
  }

  const currentCard =
    await t.card(
      "id",
      "name"
    );

  const sourceCards =
    await getSourceCards(t);

  const companyKey =
    normalizeCompany(company);


  const matchingSources =
    sourceCards.filter(
      function(card) {

        return (
          card.companyKey ===
          companyKey
        );
      }
    );


  /*
   * Do not arbitrarily choose between
   * duplicate company templates.
   */

  if (matchingSources.length > 1) {

    throw new Error(
      "Bedrijf komt meerdere keren voor"
    );
  }


  const sourceCard =
    matchingSources[0];


  if (!sourceCard) {

    throw new Error(
      "Stappenbron niet gevonden voor " +
      company
    );
  }


  if (
    !sourceCard.checklists ||
    sourceCard.checklists.length === 0
  ) {

    throw new Error(
      "De stappenbron van " +
      company +
      " bevat geen checklists"
    );
  }


  const existing =
    await t.card(
      "checklists"
    );


  if (
    existing.checklists &&
    existing.checklists.length > 0
  ) {

    throw new Error(
      "Deze medewerker heeft al checklists"
    );
  }


  for (
    const checklist
    of sourceCard.checklists
  ) {

    const url =
      "https://api.trello.com/1/cards/" +
      currentCard.id +
      "/checklists?idChecklistSource=" +
      encodeURIComponent(
        checklist.id
      );

    const response =
      await fetch(
        url,
        {

          method:
            "POST",

          headers: {

            "Authorization":
              "Bearer " + token,

            "Accept":
              "application/json"
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "Checklist kopiëren mislukt: " +
        response.status
      );
    }
  }
}


/* =========================================================
   COMPANY SELECTION
   ========================================================= */

async function chooseCompany(
  t,
  company
) {

  try {

    const existingCompany =
      await t.get(
        "card",
        "shared",
        "company",
        null
      );

    if (existingCompany) {

      throw new Error(
        "Bedrijf is al ingesteld op " +
        existingCompany
      );
    }

    await copyCompanyChecklists(
      t,
      company
    );

    await t.set(
      "card",
      "shared",
      "company",
      company
    );

    await t.closePopup();

    await t.alert({

      message:
        "Onboarding voor " +
        company +
        " is geladen"
    });

  } catch (error) {

    console.error(error);

    await t.alert({

      message:
        error.message
    });
  }
}


/* =========================================================
   DYNAMIC COMPANY MENU
   ========================================================= */

async function openCompanySelector(t) {

  const sourceCards =
    await getSourceCards(t);

  if (
    sourceCards.length === 0
  ) {

    return t.alert({

      message:
        "Geen onboardingssjablonen gevonden"
    });
  }


  /*
   * Each company appears only once,
   * even when duplicate source cards exist.
   */

  const uniqueCompanies =
    new Map();


  sourceCards.forEach(
    function(source) {

      if (
        !uniqueCompanies.has(
          source.companyKey
        )
      ) {

        uniqueCompanies.set(
          source.companyKey,
          source.company
        );
      }
    }
  );


  const items =
    Array
      .from(
        uniqueCompanies.values()
      )

      .sort(function(a, b) {

        return a.localeCompare(b);
      })

      .map(
        function(company) {

          return {

            text:
              company,

            callback:
              function(t) {

                return chooseCompany(
                  t,
                  company
                );
              }
          };
        }
      );


  return t.popup({

    title:
      "Selecteer bedrijf",

    items:
      items
  });
}


/* =========================================================
   POWER-UP
   ========================================================= */

window.TrelloPowerUp.initialize({


  /* -------------------------------------------------------
     OPEN CARD
     ------------------------------------------------------- */

  "card-detail-badges":
    async function(t) {


      const card =
        await t.card(
          "name"
        );


      /*
       * TEMPLATE CARD
       */

      if (isSourceCard(card)) {

        const badges = [];


        const duplicateCompany =
          await isDuplicateCompanyTemplate(
            t
          );


        if (duplicateCompany) {

          badges.push({

            title:
              "Waarschuwing",

            text:
              "Dubbel bedrijf",

            color:
              "red"
          });
        }


        const empty =
          await isTemplateEmpty(t);


        if (empty) {

          badges.push({

            title:
              "Waarschuwing",

            text:
              "Sjabloon leeg",

            color:
              "red"
          });
        }


        return badges;
      }


      const badges = [];


      /*
       * DUPLICATE EMPLOYEE
       */

      const duplicate =
        await isDuplicateCard(t);


      if (duplicate) {

        badges.push({

          title:
            "Waarschuwing",

          text:
            "Dubbele medewerker",

          color:
            "red"
        });
      }


      /*
       * AUTHORIZATION
       */

      const token =
        await getOAuthToken(t);


      if (!token) {

        badges.push({

          title:
            "NKTR-toegang",

          text:
            "Autoriseren",

          callback:
            function(t) {

              return authorizeUser(t);
            }
        });
      }


      /*
       * COMPANY
       */

      const company =
        await t.get(
          "card",
          "shared",
          "company",
          null
        );


      if (company) {

        badges.push({

          title:
            "Bedrijf",

          text:
            company
        });

      } else {

        badges.push({

          title:
            "Bedrijf",

          text:
            "Bedrijf instellen",

          callback:
            function(t) {

              return openCompanySelector(
                t
              );
            }
        });
      }


      return badges;
    },


  /* -------------------------------------------------------
     CLOSED CARD
     ------------------------------------------------------- */

  "card-badges":
    async function(t) {


      const card =
        await t.card(
          "name"
        );


      /*
       * TEMPLATE CARD
       */

      if (isSourceCard(card)) {

        return [{

          dynamic:
            async function() {


              const duplicateCompany =
                await isDuplicateCompanyTemplate(
                  t
                );


              if (duplicateCompany) {

                return {

                  text:
                    "⚠ DUBBEL BEDRIJF",

                  color:
                    "red",

                  refresh:
                    10
                };
              }


              const empty =
                await isTemplateEmpty(
                  t
                );


              return {

                text:
                  empty
                    ? "⚠ SJABLOON LEEG"
                    : "",

                color:
                  empty
                    ? "red"
                    : null,

                refresh:
                  10
              };
            }
        }];
      }


      const list =
        await t.list(
          "name"
        );


      /*
       * FULLY OPERATIONAL
       */

      if (
        list.name ===
        FULLY_OPERATIONAL_LIST
      ) {

        return [{

          dynamic:
            async function() {


              await syncOperationalCover(
                t
              );


              const incomplete =
                await hasIncompleteSteps(
                  t
                );


              return {

                text:
                  incomplete
                    ? "⚠ ONVOLLEDIG"
                    : "",

                color:
                  incomplete
                    ? "red"
                    : null,

                refresh:
                  10
              };
            }
        }];
      }


      /*
       * NORMAL EMPLOYEE CARD
       */

      const badges = [];


      badges.push({

        dynamic:
          async function() {


            await syncOperationalCover(
              t
            );


            const duplicate =
              await isDuplicateCard(
                t
              );


            return {

              text:
                duplicate
                  ? "⚠ DUPLICAAT"
                  : "",

              color:
                duplicate
                  ? "red"
                  : null,

              refresh:
                10
            };
          }
      });


      /*
       * PROGRESS
       */

      badges.push({

        dynamic:
          async function() {


            const progress =
              await getProgressBar(
                t
              );


            return {

              text:
                progress,

              refresh:
                10
            };
          }
      });


      /*
       * COMPANY
       */

      const company =
        await t.get(
          "card",
          "shared",
          "company",
          null
        );


      if (company) {

        badges.push({

          text:
            company
        });
      }


      return badges;
    }


}, {

  clientId:
    CLIENT_ID,

  redirectUri:
    REDIRECT_URI

});

</script>

</body>
</html>
