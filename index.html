<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const ICON =
      "https://cdn.hyperdev.com/us-east-1%3A3d31b21c-01a0-4da2-8827-4bc6e88b7618%2Ficon-gray.svg";

    function saveCompany(t, company) {
      return t.set("card", "shared", "company", company)
        .then(function () {
          return t.closePopup();
        });
    }

    function openCompanySelector(t) {
      return t.popup({
        title: "Select company",
        items: [
          {
            text: "ASS",
            callback: function (t) {
              return saveCompany(t, "ASS");
            }
          },
          {
            text: "BMS",
            callback: function (t) {
              return saveCompany(t, "BMS");
            }
          },
          {
            text: "BMS AMS",
            callback: function (t) {
              return saveCompany(t, "BMS AMS");
            }
          },
          {
            text: "COVA",
            callback: function (t) {
              return saveCompany(t, "COVA");
            }
          }
        ]
      });
    }

    window.TrelloPowerUp.initialize({

      "card-buttons": function (t) {
        return t.get("card", "shared", "company", null)
          .then(function (company) {

            if (company) {
              return [];
            }

            return [{
              icon: ICON,
              text: "Set company",
              condition: "edit",
              callback: function (t) {
                return openCompanySelector(t);
              }
            }];
          });
      }

    });
  </script>
</body>
</html>
