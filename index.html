<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const CLIENT_ID = "VGpJ9UId4pH0TheoJUoTuVczLidyM3IQ";

    const REDIRECT_URI =
      "https://maricenktr.github.io/nktr-trello-onboarding/oauth-callback.html";

    const SOURCE_CARDS = {
      "ASS": "🔒︎ ONB | ASS | Stappenbron",
      "BMS": "🔒︎ ONB | BMS | Stappenbron",
      "BMS AMS": "🔒︎ ONB | BMS AMS | Stappenbron",
      "COVA": "🔒︎ ONB | COVA | Stappenbron"
    };

    const FULLY_OPERATIONAL_LIST = "Fully Operational";

    function isSourceCard(card) {
      return card.name.includes("Stappenbron");
    }

    function normalizeName(name) {
      return (name || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    async function isDuplicateCard(t) {
      const currentCard = await t.card("id", "name");
      const cards = await t.cards("id", "name");

      if (isSourceCard(currentCard)) return false;

      const currentName = normalizeName(currentCard.name);

      if (!currentName) return false;

      const matches = cards.filter(function(card) {
        return (
          !isSourceCard(card) &&
          normalizeName(card.name) === currentName
        );
      });

      return matches.length > 1;
    }

    async function getOAuthToken(t) {
      try {
        const oauth = t.getOAuth2ApiClient();
        return await oauth.getAccessToken();
      } catch (error) {
        return null;
      }
    }

    async function updateCardCover(token, cardId, cover) {
      const response = await fetch(
        "https://api.trello.com/1/cards/" + cardId,
        {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + token,
            "Accept": "application/json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            cover: cover
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          "Cover update failed: " + response.status
        );
      }

      return response.json();
    }

    async function syncOperationalCover(t) {
      try {
        const card = await t.card(
          "id",
          "name",
          "cover"
        );

        if (isSourceCard(card)) return;

        const list = await t.list("name");

        const shouldBeGreen =
          list.name === FULLY_OPERATIONAL_LIST;

        const applied = await t.get(
          "card",
          "shared",
          "operationalGreenApplied",
          false
        );

        const isAlreadyGreen =
          card.cover &&
          card.cover.color === "green";

        const token = await getOAuthToken(t);

        if (!token) return;

        // ENTER FULLY OPERATIONAL
        if (shouldBeGreen) {
          if (!isAlreadyGreen) {
            await updateCardCover(
              token,
              card.id,
              {
                color: "green",
                size: "full",
                brightness: "dark"
              }
            );
          }

          if (!applied) {
            await t.set(
              "card",
              "shared",
              "operationalGreenApplied",
              true
            );
          }

          return;
        }

        // LEAVE FULLY OPERATIONAL
        if (!shouldBeGreen && applied) {
          await updateCardCover(
            token,
            card.id,
            {}
          );

          await t.set(
            "card",
            "shared",
            "operationalGreenApplied",
            false
          );
        }

      } catch (error) {
        console.error(
          "Operational cover sync failed:",
          error
        );
      }
    }

    async function copyCompanyChecklists(t, company) {
      const oauth = t.getOAuth2ApiClient();
      const token = await oauth.getAccessToken();

      if (!token) {
        throw new Error("Not authorized");
      }

      const currentCard = await t.card(
        "id",
        "name"
      );

      const cards = await t.cards(
        "id",
        "name",
        "checklists"
      );

      const sourceName = SOURCE_CARDS[company];

      const sourceCard = cards.find(
        function(card) {
          return card.name === sourceName;
        }
      );

      if (!sourceCard) {
        throw new Error(
          "Source card not found: " +
          sourceName
        );
      }

      const existing =
        await t.card("checklists");

      if (
        existing.checklists &&
        existing.checklists.length > 0
      ) {
        throw new Error(
          "This card already contains checklists"
        );
      }

      for (const checklist of sourceCard.checklists) {
        const url =
          "https://api.trello.com/1/cards/" +
          currentCard.id +
          "/checklists?idChecklistSource=" +
          encodeURIComponent(checklist.id);

        const response = await fetch(
          url,
          {
            method: "POST",
            headers: {
              "Authorization":
                "Bearer " + token,
              "Accept":
                "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            "Checklist copy failed: " +
            response.status
          );
        }
      }
    }

    async function chooseCompany(t, company) {
      try {
        await copyCompanyChecklists(
          t,
          company
        );

        await t.set(
          "card",
          "shared",
          "company",
          company
        );

        await t.closePopup();

        await t.alert({
          message:
            company +
            " onboarding loaded"
        });

      } catch (error) {
        console.error(error);

        await t.alert({
          message:
            "Could not load onboarding: " +
            error.message
        });
      }
    }

    function openCompanySelector(t) {
      return t.popup({
        title: "Select company",
        items: [
          {
            text: "ASS",
            callback: function(t) {
              return chooseCompany(t, "ASS");
            }
          },
          {
            text: "BMS",
            callback: function(t) {
              return chooseCompany(t, "BMS");
            }
          },
          {
            text: "BMS AMS",
            callback: function(t) {
              return chooseCompany(t, "BMS AMS");
            }
          },
          {
            text: "COVA",
            callback: function(t) {
              return chooseCompany(t, "COVA");
            }
          }
        ]
      });
    }

    window.TrelloPowerUp.initialize({

      "card-detail-badges": async function(t) {
        const card = await t.card("name");

        if (isSourceCard(card)) {
          return [];
        }

        const badges = [];

        const duplicate =
          await isDuplicateCard(t);

        if (duplicate) {
          badges.push({
            title: "Warning",
            text: "Duplicate employee name",
            color: "red"
          });
        }

        const company =
          await t.get(
            "card",
            "shared",
            "company",
            null
          );

        if (company) {
          badges.push({
            title: "Company",
            text: company
          });
        } else {
          badges.push({
            title: "Company",
            text: "Set company",
            callback: function(t) {
              return openCompanySelector(t);
            }
          });
        }

        return badges;
      },

      "card-badges": async function(t) {
        const card =
          await t.card("name");

        if (isSourceCard(card)) {
          return [];
        }

        const badges = [];

        badges.push({
          dynamic:
            async function() {

              await syncOperationalCover(t);

              const duplicate =
                await isDuplicateCard(t);

              return {
                text:
                  duplicate
                    ? "⚠ DUPLICATE"
                    : "",
                color:
                  duplicate
                    ? "red"
                    : null,
                refresh: 10
              };
            }
        });

        const company =
          await t.get(
            "card",
            "shared",
            "company",
            null
          );

        if (company) {
          badges.push({
            text: company
          });
        }

        return badges;
      }

    }, {
      clientId: CLIENT_ID,
      redirectUri: REDIRECT_URI
    });

  </script>
</body>
</html>
