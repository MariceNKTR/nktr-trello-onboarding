<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NKTR Onboarding</title>
</head>

<body>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <script>
    const TOTAL_SEGMENTS = 10;

    function makeProgressBar(checklists) {
      const items = (checklists || []).flatMap(
        checklist => checklist.checkItems || []
      );

      const total = items.length;

      if (total === 0) {
        return "";
      }

      const completed = items.filter(
        item => item.state === "complete"
      ).length;

      const filled = Math.round(
        (completed / total) * TOTAL_SEGMENTS
      );

      return "█".repeat(filled) +
             "░".repeat(TOTAL_SEGMENTS - filled);
    }

    function setCompany(t, company) {
      return t.set("card", "shared", "company", company)
        .then(function () {
          return t.closePopup();
        });
    }

    function openCompanySelector(t) {
      return t.popup({
        title: "Select company",
        items: [
          {
            text: "ASS",
            callback: function (t) {
              return setCompany(t, "ASS");
            }
          },
          {
            text: "BMS",
            callback: function (t) {
              return setCompany(t, "BMS");
            }
          },
          {
            text: "BMS AMS",
            callback: function (t) {
              return setCompany(t, "BMS AMS");
            }
          },
          {
            text: "COVA",
            callback: function (t) {
              return setCompany(t, "COVA");
            }
          }
        ]
      });
    }

    window.TrelloPowerUp.initialize({

      "card-buttons": function (t) {
        return t.get("card", "shared", "company", null)
          .then(function (company) {

            if (company) {
              return [];
            }

            return [{
              icon: "https://cdn.hyperdev.com/us-east-1%3A3d31b21c-01a0-4da2-8827-4bc6e88b7618%2Ficon-gray.svg",
              text: "Set company",
              callback: function (t) {
                return openCompanySelector(t);
              },
              condition: "edit"
            }];
          });
      },

      "card-badges": function (t) {
        return [{
          dynamic: function () {
            return t.card("checklists").then(function (card) {
              return {
                text: makeProgressBar(card.checklists),
                refresh: 10
              };
            });
          }
        }];
      }

    });
  </script>
</body>
</html>
