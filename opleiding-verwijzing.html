<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONB | Naar Opleiding</title><style>body{font:15px system-ui;background:#20252c;color:#ecf0f4;padding:20px}button,select{padding:10px 13px;background:#3c4553;border:1px solid #667286;color:white;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}p{color:#b4bdc7}button{margin:5px}#found button{display:block}#message{padding:12px;background:#343c47;border-radius:6px;white-space:pre-wrap}label{display:block;margin-top:12px}</style></head><body><h1>Naar Opleiding</h1><p>De originele ONB-kaart blijft staan. Een gekoppelde Opleiding-kaart wordt gemaakt, met eigen checklists en historie.</p><div id="message">Medewerker controleren…</div><div id="found"></div><button id="create" disabled>OPLEIDING TOEWIJZEN</button><script src="https://p.trellocdn.com/power-up.min.js"></script><script>
const t=window.TrelloPowerUp.iframe(),CORE='https://nktr-employee-core.marice-angulo.workers.dev';let card=null,linked=false;const msg=s=>document.getElementById('message').textContent=s;async function call(path,action,x={}){const jwt=await t.jwt({state:JSON.stringify({action})});const r=await fetch(CORE+path,{method:'POST',headers:{Authorization:'Bearer '+jwt,'Content-Type':'application/json'},body:JSON.stringify(x),signal:AbortSignal.timeout(50000)});const d=await r.json();if(!r.ok)throw Error(d.error||'Verbinding mislukt');return d}async function connect(id,distinct=false){msg('Medewerker koppelen…');try{const d=await call('/v1/link','core-link',{cardId:card.id,employeeId:id||undefined,confirmDistinct:distinct});linked=true;msg('Medewerker gekoppeld. Opleiding kan worden toegewezen.');document.getElementById('create').disabled=false}catch(err){msg(err.message)}}(async()=>{try{card=await t.card('id','name');const r=await call('/v1/lookup','core-lookup',{name:card.name});const found=document.getElementById('found');if(r.matches.length){msg('Mogelijke bestaande medewerker(s). Controleer de identiteit.');for(const p of r.matches){const same=(p.links||[]).some(l=>l.card_id===card.id);const btn=document.createElement('button');btn.textContent=`${p.name} · ${p.status}${same?' · Deze kaart':''}`;btn.onclick=()=>connect(p.id);found.append(btn)}}else{msg('Naam niet gekoppeld. Je kunt een nieuwe identiteit registreren.')}const add=document.createElement('button');add.textContent='Nieuwe afzonderlijke identiteit bevestigen';add.onclick=()=>connect(null,true);found.append(add)}catch(err){msg('Niet beschikbaar: '+err.message)}})();document.getElementById('create').onclick=async()=>{if(!linked)return;const b=document.getElementById('create');b.disabled=true;msg('Opleiding-kaart maken…');try{const x=await call('/v1/training/assign','core-training-assign',{cardId:card.id});msg(x.status==='EXISTS'?'Er bestaat al een Opleiding-kaart.':'Opleiding-kaart aangemaakt.');const link=document.createElement('a');link.href='https://trello.com/c/'+x.training_card_id;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Bekijk Opleiding kaart';link.style.color='#adcbff';document.body.append(link)}catch(err){msg('Niet bevestigd: '+err.message);b.disabled=false}};
</script></body></html>
