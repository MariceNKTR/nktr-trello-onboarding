<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NKTR · Identiteitscontrole</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#eeebf4;background:transparent}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-width:0;overflow-x:hidden}
body{padding:3px 4px 7px;font-size:12px;line-height:1.3}
.panel{border:1px solid #9871c5;border-radius:15px;background:linear-gradient(125deg,#241c31 0%,#1c1926 55%,#211829 100%);box-shadow:0 0 0 1px rgba(174,134,219,.08),0 4px 14px rgba(0,0,0,.13);padding:8px 10px 7px;max-width:100%;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:flex-start;gap:9px;border-bottom:1px solid rgba(200,179,229,.20);padding:0 0 6px;margin:0 0 7px;min-width:0}
.brand-logo{display:block;width:77px;height:30px;flex:none;overflow:visible}
.brand-divider{height:25px;width:1px;background:#9074ad;opacity:.8;flex:none}
.section-note{font-size:12px;font-weight:500;color:#f0eaf7;white-space:nowrap}
.notice{display:flex;align-items:center;min-height:30px;padding:5px 9px;border:1px solid #5f4977;border-radius:9px;background:linear-gradient(90deg,#4e3a65,#3b2c51);font-weight:650;color:#f5f2f9;line-height:1.2;gap:8px}
.notice::before{content:'ⓘ';font-size:14px;font-weight:400;color:#ded3ed;line-height:1}
.notice.warning{background:linear-gradient(90deg,#62412f,#473326);border-color:#8b6441}
.notice.success{background:linear-gradient(90deg,#274c45,#243b37);border-color:#467d6b}
.meta{font-size:12px;color:#d1c7db;margin:5px 3px 4px}
.muted{color:#cec3d7}
#candidates{margin:0 3px 5px;color:#d5ccde}
#candidates>p{font-size:12px;margin:2px 0 5px;line-height:1.25}
.candidate{padding:5px 0;border-bottom:1px solid rgba(203,187,219,.18);font-size:12px}
.candidate a{color:#d0b7ff;text-decoration:underline;font-size:12px}
label{display:block;margin:5px 0 3px;font-size:12px;font-weight:650;color:#ebe4f3}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) 111px;gap:8px;align-items:stretch}
button,select{font:inherit;font-size:12px;border-radius:7px;border:1px solid #877991;padding:5px 8px;min-height:29px;margin:0;width:100%;color:#ede6f6;background:#2a2632}
select{min-width:0;appearance:auto;cursor:pointer;color:#efecf2;background:#292531}
select:focus,button:focus-visible,summary:focus-visible{outline:2px solid #b793eb;outline-offset:1px}
button{cursor:pointer;font-weight:550}
button.primary{border-color:#8a60c0;background:linear-gradient(180deg,#6d49aa,#503184);color:white;font-weight:650}
button.secondary{border-color:#82758e;background:linear-gradient(180deg,#33303c,#292530);color:#f2ecf7}
button:hover:not(:disabled){filter:brightness(1.13)}
button:disabled,select:disabled{opacity:.48;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
#err{color:#ffc4c4;white-space:pre-wrap;font-size:12px;margin:6px 0}
#info{white-space:pre-wrap}
#coreArea{margin-top:8px;padding-top:7px;border-top:1px solid rgba(202,176,224,.26);font-size:12px}
#coreArea summary{font-size:12px;font-weight:650;color:#f2e9fc;cursor:pointer;list-style:revert}
#coreInfo{font-size:12px;color:#d5c9df;margin:5px 0}
#coreArea button,#archive-area button{margin:5px 0}
#coreArea select,#archive-area select{margin-bottom:5px}
#archive-area{margin-top:6px;padding-top:6px;border-top:1px solid rgba(200,179,229,.20)}
#archive-area p{font-size:12px;color:#d6c6df;margin:3px 0}
.hidden,[hidden]{display:none!important}
#content{margin:0}
@media(max-width:360px){.link-row{grid-template-columns:minmax(0,1fr) 88px;gap:5px}.brand-logo{width:68px;height:27px}.panel{padding:7px}.row{gap:5px}}

.panel{padding:9px 11px 11px}
.topbar{margin-bottom:8px}
.employee-name{font-size:14px;font-weight:750;color:#f6f2fa;line-height:1.3;margin:0 2px 3px}
.company-name{font-size:12px;color:#d7c8e3;margin:0 2px 8px}
.status-line{display:flex;align-items:center;gap:7px;margin:0 1px;color:#d6c9df;font-size:12px;line-height:1.35}
.status-mark{font-size:15px;line-height:1}
.status-line.good{color:#bbedd5}.status-line.good .status-mark{color:#8edbb3}
.status-line.warning{color:#f0ccac}.status-line.warning .status-mark{color:#ffd09a}
.status-line.waiting{color:#dbcfeb}.status-line.waiting .status-mark{color:#b99ed2}
#action{margin-top:9px;max-width:100%;text-align:left}
#err{font-size:12px;margin-top:8px;color:#ffd0d0}
</style>

<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
'use strict';
const API='https://nktr-employee-core-stage.marice-angulo.workers.dev/api/identity/';
const t=window.TrelloPowerUp.iframe();const $=id=>document.getElementById(id);
let cardId=null,state=null,busy=false,action=null;
function fit(){requestAnimationFrame(()=>{try{Promise.resolve(t.sizeTo(document.body)).catch(()=>{});}catch{}})}
function err(message){$('err').textContent=message||'';$('err').hidden=!message;fit()}
async function identity(actionName,payload={}){
 const jwt=await t.jwt({state:JSON.stringify({action:'v46-'+actionName,cardId})});
 const r=await fetch(API+actionName,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jwt},body:JSON.stringify({cardId,...payload})});
 let result;try{result=await r.json()}catch{throw Error('Serverantwoord niet beschikbaar')}
 if(!r.ok)throw Error(result.error||'Verbinding mislukt ('+r.status+')');return result;
}
function paint(d){
 state=d;$('name').textContent=d.card.name;
 $('company').textContent=d.companyName||'Bedrijf nog niet bevestigd';
 const unresolved=Number(d.unresolvedMatches||0);
 const registered=!!d.registered;const linked=!!d.linkedOnboarding;
 const review=d.review?.status==='OPEN';let kind='waiting',message='',next=null;
 if(review){kind='warning';message='Controle aangevraagd';
 }else if(unresolved>0){
   kind='warning';message='Mogelijke dubbele medewerker · Controle nodig';
   {
     if(d.canAutoLink&&d.autoLinkCardId)next={type:'link',label:'Koppelen aan medewerker',onb:d.autoLinkCardId};
     else next={type:'review',label:'Controle aanvragen'};
   }
 }else if(registered&&!d.companyName){
   kind='warning';message='Bedrijf moet worden gecontroleerd';next={type:'review',label:'Controle aanvragen'};
 }else if(registered&&d.companyName){
   kind='good';message='Geregistreerd · Geen mogelijke dubbelen gevonden';
 }else if(d.card.board==='OPL'&&!linked){
   kind='warning';message=review?'Controle aangevraagd':'Medewerker nog niet gekoppeld';
   if(!review)next={type:'review',label:'Controle aanvragen'};
 }else if(linked){kind='waiting';message='Gekoppeld · Registratie nog niet voltooid';}
 else if(d.card.board==='ONB'&&!d.companyName){
   kind='warning';message=review?'Controle aangevraagd':'Bedrijf moet worden gecontroleerd';
   if(!review)next={type:'review',label:'Controle aanvragen'};
 }else {kind='waiting';message='Registratie nog niet voltooid';}
 // Only a D1 registration is presented as registered. No automatic success shortcuts.
 const line=$('status');line.className='status-line '+kind;
 $('statusMark').textContent=kind==='good'?'✓':kind==='warning'?'!':'○';
 $('statusText').textContent=message;
 action=next;const button=$('action');button.classList.toggle('hidden',!next);
 if(next){button.textContent=next.label;button.disabled=busy;}
 fit();
}
async function reload(){err('');const data=await identity('inspect');paint(data)}
$('action').addEventListener('click',async()=>{
 if(!action||busy)return;const selected=action;busy=true;$('action').disabled=true;err('');
 try{
  if(selected.type==='link'){
   if(!confirm('Deze Opleiding-kaart koppelen aan de bestaande medewerker?'))return;
   await identity('resolve',{onboardingCardId:selected.onb,mode:'LINK'});
  }else if(selected.type==='review')await identity('review',{reason:'Controleer medewerkergegevens of mogelijke dubbele registratie'});
  await reload();
 }catch(e){err(e.message||'Actie niet gelukt')}finally{busy=false;if(state)paint(state)}
});
(async()=>{try{cardId=(await t.card('id')).id;await reload()}catch(e){$('statusText').textContent='Controle tijdelijk niet beschikbaar';err(e.message||'Verbinding mislukt')}})();
</script></body></html>
